<!DOCTYPE html>
<html lang="en">
    <head> 
    <!-- info about webpage -->
        <meta charset="UTF-8"/> <!-- describes the charcter system used -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/> <!-- proper display on different screen sizes -->
        <title>Lina's Portfolio</title>
        <link rel="stylesheet" href="style.css?v=5"/>
        <link rel="icon" type="image/png" href="images/favicon.png">
        <!-- fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Advent+Pro:wght@400;500;600&family=Andada+Pro:wght@400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
    </head>

    <body>
    <!-- visibility on webpage -->
        <main class="hero">
            <div class="animation">
                <!-- background desk -->
                <picture class="desk-picture">
                    <!-- mobile -->
                    <source media="(max-width: 650px) and (orientation: portrait)" srcset="images/background-mobile.png">
                    <!-- landscape -->
                    <img class="desk" src="images/background2.png" alt="Illustrated desk workspace">
                </picture>
                    
                <div class="computer-screen">
                    <pre class="screen-code"><code><span class="keyword">int</span> <span class="function">main</span><span class="symbol">() {</span><br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="printf">printf</span><span class="symbol">(</span><span class="string">"Hello, World!"</span><span class="symbol">);</span><br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="keyword">return</span>&nbsp;<span class="number">0</span><span class="symbol">;</span><br><span class="symbol">}</span><span class="code-cursor" aria-hidden="true"></span></code></pre>

                    <div class="error">
                        <span>ERROR</span>
                        <small>SYSTEM FAILURE</small>
                    </div>

                    <div class="intro-text">
                        <h1 class="name">Lina Mustafa</h1>
                        <p class="subtitle">Software Engineering Portfolio</p>
                    </div>
                </div>

                <!-- coffee cup -->
                <img class="coffee-cup" src="images/coffee2.png" alt="Illustrated cup of coffee">
                <!-- coffee spill -->
                <img class="coffee-spill" src="images/coffee-spill2.png" alt="Spilled coffee">
            </div>                
        <a class="scroll-link" href="#menu">
            <span>↓</span>
        </a>
        </main>

        <section id="menu" class="menu">
            <div class="menu-buttons">
                <button id="aboutbtn" style="text-align: center;">About Me</button>
                <button id="projectsbtn" style="text-align: center;">Projects</button>
                <button id="skillsbtn" style="text-align: center;">Skills</button>
                <button id="contactbtn" style="text-align: center;">Contact</button>
            </div>
        </section>

        <script src="script.js"></script>
    </body>
</html>
